services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: novabank-oracle-db
    environment:
      ORACLE_PWD: ${ORACLE_DB_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init.sql:/opt/oracle/scripts/startup/01_init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 90s
    restart: unless-stopped

volumes:
  oracle-data: